name: vra-poc00
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: vra_poc00
      POSTGRES_USER: vra_poc00
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "127.0.0.1:${VRA_PG_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vra_poc00 -d vra_poc00"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: "no"
secrets:
  db_password:
    file: ./.local/secrets/db_password
volumes:
  postgres_data:
