name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java 21 / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Docker availability
        run: docker version

      - name: Verify Gradle wrapper
        run: ./backend/gradlew -p backend --version

      - name: Run backend verification and build artifacts
        run: |
          ./backend/gradlew \
            -p backend \
            --no-daemon \
            --warning-mode all \
            :runtime:clean \
            :migration:clean \
            :runtime:check \
            :migration:check \
            :runtime:bootJar \
            :migration:bootJar

      - name: Prove PostgreSQL integration suites executed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          suites = {
              "runtime": Path(
                  "backend/runtime/build/test-results/integrationTest"
              ),
              "migration": Path(
                  "backend/migration/build/test-results/integrationTest"
              ),
          }

          failed = False

          for name, directory in suites.items():
              xml_files = sorted(directory.glob("TEST-*.xml"))

              if not xml_files:
                  print(
                      f"FAIL: {name} PostgreSQL integration suite "
                      "produced no XML results."
                  )
                  failed = True
                  continue

              tests = 0
              skipped = 0
              failures = 0
              errors = 0

              for file in xml_files:
                  root = ET.parse(file).getroot()
                  tests += int(root.attrib.get("tests", "0"))
                  skipped += int(root.attrib.get("skipped", "0"))
                  failures += int(root.attrib.get("failures", "0"))
                  errors += int(root.attrib.get("errors", "0"))

              print(
                  f"{name}: tests={tests} skipped={skipped} "
                  f"failures={failures} errors={errors}"
              )

              if tests <= 0:
                  print(
                      f"FAIL: {name} PostgreSQL integration suite "
                      "executed zero tests."
                  )
                  failed = True

              if skipped != 0 or failures != 0 or errors != 0:
                  print(
                      f"FAIL: {name} PostgreSQL integration suite "
                      "was not fully green."
                  )
                  failed = True

          if failed:
              sys.exit(1)

          print(
              "PASS: runtime and migration PostgreSQL "
              "integration suites executed with no skips."
          )
          PY

      - name: Verify deployable JVM artifacts exist
        shell: bash
        run: |
          test -s backend/runtime/build/libs/runtime-0.1.0-SNAPSHOT.jar
          test -s backend/migration/build/libs/migration-0.1.0-SNAPSHOT.jar

          ls -lh \
            backend/runtime/build/libs/runtime-0.1.0-SNAPSHOT.jar \
            backend/migration/build/libs/migration-0.1.0-SNAPSHOT.jar
